name: Build macOS Swift App

permissions:
  contents: read

on:
  push:
    paths:
      - ".github/workflows/build-macos-swift.yml"
      - "macosx-swift/**"
      - "macosx/**"
      - "pinentry/**"
      - "secmem/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/build-macos-swift.yml"
      - "macosx-swift/**"
      - "macosx/**"
      - "pinentry/**"
      - "secmem/**"
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS 26 / arm64
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Export build paths
        run: |
          {
            echo "DERIVED_DATA_PATH=$RUNNER_TEMP/pinentry-mac-modern-build"
            echo "APP_PATH=$RUNNER_TEMP/pinentry-mac-modern-build/Build/Products/Release/pinentry-mac-swift.app"
            echo "NOTARY_ZIP_PATH=$RUNNER_TEMP/pinentry-mac-swift-notary.zip"
            echo "ZIP_PATH=$GITHUB_WORKSPACE/artifacts/pinentry-mac-swift-macos26-arm64.zip"
          } >> "$GITHUB_ENV"

      - name: Configure signing mode
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          if [[ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" ]] &&
             [[ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" ]] &&
             [[ -n "$APPLE_TEAM_ID" ]] &&
             [[ -n "$APPLE_NOTARY_KEY_ID" ]] &&
             [[ -n "$APPLE_NOTARY_ISSUER_ID" ]] &&
             [[ -n "$APPLE_NOTARY_KEY" ]]; then
            echo "SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
          else
            echo "SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
          fi

      - name: Show selected Xcode
        run: |
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install libassuan libgpg-error gettext

      - name: Export Homebrew dependency prefixes
        run: |
          {
            echo "PINENTRY_MAC_SWIFT_ASSUAN_PREFIX=$(brew --prefix libassuan)"
            echo "PINENTRY_MAC_SWIFT_GPG_ERROR_PREFIX=$(brew --prefix libgpg-error)"
            echo "PINENTRY_MAC_SWIFT_GETTEXT_PREFIX=$(brew --prefix gettext)"
          } >> "$GITHUB_ENV"

      - name: Show Homebrew dependency libraries
        run: |
          for formula in libassuan libgpg-error gettext; do
            prefix="$(brew --prefix "$formula")"
            echo "$formula: $prefix"
            find "$prefix/lib" -maxdepth 1 -name "*.dylib" -print
          done

      - name: Import Developer ID certificate
        if: env.SIGNING_MODE == 'developer-id'
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"

          echo "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build pinentry-mac-swift
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing_args=(
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY=-
            CODE_SIGNING_ALLOWED=YES
            CODE_SIGNING_REQUIRED=NO
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          )

          if [[ "$SIGNING_MODE" == "developer-id" ]]; then
            signing_args=(
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY="Developer ID Application"
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
              CODE_SIGNING_ALLOWED=YES
              CODE_SIGNING_REQUIRED=YES
              ENABLE_HARDENED_RUNTIME=YES
            )
          fi

          xcodebuild \
            -project macosx-swift/pinentry-mac-swift.xcodeproj \
            -scheme pinentry-mac-swift \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            "${signing_args[@]}" \
            build

      - name: Verify bundled dynamic libraries
        run: |
          assert_arm64_only() {
            test "$(lipo -archs "$1")" = "arm64"
          }

          test -x "$APP_PATH/Contents/MacOS/pinentry-mac-swift"
          test -f "$APP_PATH/Contents/Frameworks/libassuan.0.dylib"
          test -f "$APP_PATH/Contents/Frameworks/libgpg-error.0.dylib"
          assert_arm64_only "$APP_PATH/Contents/MacOS/pinentry-mac-swift"
          assert_arm64_only "$APP_PATH/Contents/Frameworks/libassuan.0.dylib"
          assert_arm64_only "$APP_PATH/Contents/Frameworks/libgpg-error.0.dylib"
          otool -L "$APP_PATH/Contents/MacOS/pinentry-mac-swift"
          otool -L "$APP_PATH/Contents/Frameworks/libassuan.0.dylib"
          otool -L "$APP_PATH/Contents/Frameworks/libgpg-error.0.dylib"
          if otool -L "$APP_PATH/Contents/Frameworks/libgpg-error.0.dylib" | grep -q "libintl.8.dylib"; then
            test -f "$APP_PATH/Contents/Frameworks/libintl.8.dylib"
            assert_arm64_only "$APP_PATH/Contents/Frameworks/libintl.8.dylib"
            otool -L "$APP_PATH/Contents/Frameworks/libintl.8.dylib"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize app bundle
        if: env.SIGNING_MODE == 'developer-id'
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"

          printf '%s' "$APPLE_NOTARY_KEY" > "$notary_key_path"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARY_ZIP_PATH"
          xcrun notarytool submit "$NOTARY_ZIP_PATH" \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package app bundle
        run: |
          mkdir -p "$(dirname "$ZIP_PATH")"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$ZIP_PATH"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinentry-mac-swift-macos26-arm64
          path: artifacts/pinentry-mac-swift-macos26-arm64.zip
          if-no-files-found: error
